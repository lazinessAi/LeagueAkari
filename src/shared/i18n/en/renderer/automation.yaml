automation:
  home:
    title: Automation
    autoGameflow: Automated Gameflow
    autoSelect: Auto Pick / Ban
    autoMisc: Misc
    autoChampConfig: Auto Configuration
  gameflow:
    title: Gameflow
    common:
      enabled: Enable
    sections:
      readyCheck: Auto-Accept Match
      autoHonor: Auto Honor
      playAgain: Play Again
      autoMatchmaking: Auto Matchmaking
      autoReconnect: Reconnect
      leader: Leader Transfer
      invitations: Invitations
      aramTeamSide: Team Side Message
    autoAcceptEnabled:
      label: Auto-Accept Enabled
      description: Automatically accepts the match when players are found.
      footer: Some servers or ranked tiers may already enforce auto-accept by server policy. This is unrelated to League Akari.
    autoAcceptDelaySeconds:
      label: Auto-Accept Delay (s)
      description: Delay in seconds before accepting the match after it becomes available.
    autoHonorEnabled:
      label: Auto-Honor Enabled
      description: Automatically gives all the votes at the end of a match.
    autoHonorStrategy:
      label: Honor Selection Strategy
      description: Determines which players will receive honors.
      options:
        prefer-lobby-member: Prioritize members in the lobby. If there are remaining votes, select other teammates.
        only-lobby-member: Only pre-made team members.
        all-member: All teammates.
        all-member-including-opponent: Consider all players in the current match.
        opt-out: Do not honor anyone.
    playAgainEnabled:
      label: Auto Play Again
      description:
        full: Automatically returns to the lobby after a match. You may need to enable {autoHonor} to complete the honor voting phase.
        part2: Auto-Honor
    autoMatchmakingEnabled:
      label: Auto Matchmaking
      description: Automatically starts matchmaking when available.
    autoMatchmakingMinimumMembers:
      label: Minimum Members
      description: Requires at least {{members}} members to start matchmaking automatically.
    autoMatchmakingDelaySeconds:
      label: Matchmaking Wait Time (s)
      description: Delay in seconds before starting matchmaking when available.
    autoMatchmakingWaitForInvitees:
      label: Wait for Invitees
      description: Automatically waits for all invited players to respond before starting matchmaking.
    autoMatchmakingRematchStrategy:
      label: Stop Matchmaking Strategy
      description: Defines when to stop matchmaking automatically. Matchmaking will restart if auto matchmaking is enabled.
      options:
        never: Never
        fixed-duration: Fixed Duration
        estimated-duration: Exceeds Estimated Queue Time
    autoMatchmakingRematchFixedDuration:
      label: Exit Matchmaking Time (s)
      description:
        fixed-duration: Stops matchmaking after exceeding this time, in seconds.
        no-fixed-duration: This option only applies if the stop matchmaking strategy is set to Fixed Duration.
    autoReconnectEnabled:
      label: Auto Reconnect
      description: Attempts to reconnect when in a reconnectable state.
    autoSkipLeaderEnabled:
      label: Auto Skip Leader
      description: When you are the lobby leader, transfer the leadership to other members in the lobby
    autoHandleInvitationsEnabled:
      label: Auto Handle Invitations
      description: Handles room invitations according to the configured strategy.
    invitationHandlingStrategies:
      label: Room Invitation Acceptance Strategy
      description: Processes room invitations based on the queue mode.
      options:
        accept: Accept
        decline: Decline
        ignore: Ignore
      button: Configure
      queueTypes:
        default: Default
    rejectInvitationWhenAway:
      label: Reject When Away
      description: Automatically rejects lobby invitations when the game status is set to Away.
    onlyAcceptInvitationFromFriends:
      label: Only Accept From Selected Friends
      description: When enabled, invitations are auto-accepted only if the inviter is in the whitelist below (affects "Accept" only; Decline and Ignore are unchanged). No invitation is auto-accepted while the whitelist is empty.
    acceptInvitationFriendWhitelist:
      label: Friend Whitelist
      description: Select the friends whose invitations may be auto-accepted.
      emptyHint: Selected friends appear here. Check friends on the right to add them.
      searchPlaceholder: Search friends
      unavailable: Not connected to the client, unable to load the friends list.
      noFriends: No friends found
    autoSendARAMTeamSideEnabled:
      label: Send Team Side Information
      description: 'In modes like ARAM or ARAM: Mayhem, when entering champion select, the current team side (blue or red) will be notified.'
      tooltipBody: Send your current team side information in the chat room.
      tooltipImageAlt: Example of the team side information message in chat
    autoSendARAMTeamSideVisibleToTeam:
      label: Send Team Side Information Visible to Team
      checkboxLabel: Visible to team
      description: The content of "Send Team Side Information" will be visible to team.
  champSelect:
    title: Auto Pick Ban
    temporarilyDisabled:
      label: Temporarily Disabled
      button: Re-enable
      description: The feature have been temporarily disabled in THIS champion selection.
    groupTitle: Active Mode
    groupEmpty: No Groups
    pick:
      title: Auto Pick
      enabled:
        label: Enable
        description: Enable the automatic pick of this mode.
      expectedChampions:
        label: Expected Champions
        description: The automatic pick will pick these champions, prioritizing the earlier ones in the list.
        fragment1: When assigned to
        fragment2: position
      showIntent:
        label: Show Intent
        description: Show the target champion before the pick.
      ignoreIntent:
        label: Ignore Intent
        description: Ignore the intent of the teammates.
      strategy:
        label: Lock Strategy
        description: Execute the automatic pick process according to the preset strategy.
        options:
          just-show: Just Show
          show-and-lock-in: Show and Lock-in
          lock-in-immediately: Lock-in Immediately
      delaySeconds:
        label: Delay (s)
        description: The automatic pick process will be planned according to the preset delay, including show, lock-in, or handle swap. Each stage will not exceed the system limit.
      benchMode:
        title: Bench Mode Specific (If applicable)
        tooltip: For modes that have a bench, such as ARAM or URF.
      benchSwapAccumulatedDelaySeconds:
        label: Minimum Accumulated Time (s)
        description: Only when the target champion has been on the bench for more than this value, the swap operation will be executed.
      benchSelectFirstAvailableChampion:
        label: Select First Available Champion
        description: When the target champion is on the bench, select the earlier ones in the list.
      benchHandleTradeEnabled:
        label: Handle Swap Request
        description: When a swap request is received, if the expected champion settings are met, accept the swap request. Otherwise, reject the swap request.
    ban:
      title: Auto Ban
      enabled:
        label: Enable
        description: Enable the automatic ban of this mode.
      expectedChampions:
        label: Expected Champions
        description: The automatic ban will ban these champions, prioritizing the earlier ones in the list.
        fragment1: When assigned to
        fragment2: position
      strategy:
        label: Lock Strategy
        description: Execute the automatic ban process according to the preset strategy.
        options:
          just-show: Just Show
          show-and-lock-in: Show and Lock-in
          lock-in-immediately: Lock-in Immediately
      delaySeconds:
        label: Delay (s)
        description: The automatic ban process will be planned according to the preset delay, including show, lock-in, or handle swap. Each stage will not exceed the system limit.
    championSwap:
      title: Champion Swap
      enabled:
        label: Accept Swaps From Friends
        description: When enabled, a champion swap from a whitelisted friend is accepted immediately and unconditionally, regardless of your expected champions. Has no effect while the whitelist is empty.
      autoDeclineRepeated:
        label: Auto-Decline Repeated Swaps
        description: When enabled, once you manually decline a teammate's swap request, further swap requests from that teammate are declined automatically in this champ select. Only applies to the current champ select and resets in the next game.
      friends:
        label: Friend Whitelist
        description: Select the friends whose champion swaps may be auto-accepted.
        emptyHint: Selected friends appear here. Check friends on the right to add them.
        searchPlaceholder: Search friend name or tag
        unavailable: Not connected to the client, unable to load the friends list.
        noFriends: No friends found
  misc:
    autoSurrender:
      title: Automatic Surrender
      enabled: Enable
      description: 'While the game is in the foreground, follow Chinese army surrender announcements and accept teammate votes. Check the vote panel after each action: a panel confirms initiation, and the Chinese recorded-choice text confirms voting. Retry unconfirmed actions up to five times each per round. Requires Chinese game text.'
      duration: 'Last recognition: {{ms}} ms'
      attempts: 'Initiate: {{follow}} / {{max}} · Accept: {{accept}} / {{max}}'
      lastText: Last recognized text
      saved: Chat region saved
      saveFailed: Could not save. Please try again.
      status:
        idle: Waiting for a game
        starting: Preparing recognition
        watching: Watching chat and vote panel
        paused: Recognition paused while the game is in the background
        triggered: Surrender action confirmed
        retrying: Acting and checking the result
        exhausted: Attempt limit reached for this round
        unavailable: Automatic input is unavailable
        error: Stopped. Turn off and on to retry.
      errors:
        native-input-unavailable: Automatic input is unavailable. Check administrator privileges and native input support.
        ocr-language-unavailable: Simplified Chinese OCR is unavailable. Install the Simplified Chinese optical character recognition feature in Windows Settings, then turn this feature off and on.
        ocr-initialization-failed: Could not start local recognition. Check Windows PowerShell and system OCR availability.
        ocr-scan-failed: Region recognition failed. Make sure the game window is visible, then turn this feature off and on.
        ocr-timeout: Recognition timed out. Turn this feature off and on to retry.
        ocr-worker-exited: Recognition stopped unexpectedly. Turn this feature off and on to retry.
        send-failed: Automatic input did not finish. Please act manually.
        attempts-exhausted: Five attempts completed without screen confirmation for this round. Please act manually.
      region:
        label: Chat Region
        description: Select the area containing complete chat messages. Defaults to the bottom-left quarter of the game window. Adjust after moving chat or changing its font size.
        canvasLabel: Chat recognition region preview. Drag to select or use arrow keys to move the selection.
        schematic: Game window diagram
        previewHint: Drag outside the selection to redraw. Drag the selection or its corners to move or resize it.
        expand: Enlarge Preview
        precise: Adjust Exact Values
        pickerTitle: Select Chat Region
        pickerHint: Include complete chat messages and avoid other game UI.
        keyboardHint: Drag to draw, move, or resize at the corners. Arrow keys move the selection; hold Shift for larger steps.
        cancel: Cancel
        confirm: Save Selection
        x: Left
        y: Top
        width: Width
        height: Height
        invalid: The region must be nonempty and fit inside the game window.
        reset: Reset
        save: Save Region
    autoAcceptSurrender:
      saved: 'Vote panel region saved'
      saveFailed: Could not save. Please try again.
      region:
        label: 'Vote Panel Region'
        description: 'Include the complete panel, including the surrender title and the Chinese recorded-choice text after voting. Avoid the chat area. Defaults to the bottom-right quarter of the game window. Adjust if you moved the panel.'
        canvasLabel: 'Vote panel recognition region preview. Drag to select or use arrow keys to move the selection.'
        schematic: Game window diagram
        previewHint: Drag outside the selection to redraw. Drag the selection or its corners to move or resize it.
        expand: Enlarge Preview
        precise: Adjust Exact Values
        pickerTitle: 'Select Vote Panel Region'
        pickerHint: 'Include the complete vote panel and its recorded-choice text. Avoid chat or other game UI.'
        keyboardHint: Drag to draw, move, or resize at the corners. Arrow keys move the selection; hold Shift for larger steps.
        cancel: Cancel
        confirm: Save Selection
        x: Left
        y: Top
        width: Width
        height: Height
        invalid: The region must be nonempty and fit inside the game window.
        reset: Reset
        save: Save Region
